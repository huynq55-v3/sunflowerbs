[package]
name = "sunflower-crypto"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# WASM interop
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"

# KDF — Argon2id + HKDF (SHA-256)
argon2 = "0.5"
hkdf = "0.12"
sha2 = "0.10"

# Signature (Ed25519) & DH key agreement (X25519)
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
curve25519-dalek = { version = "4", features = ["zeroize"] }

# AEAD — ChaCha20-Poly1305 (mã hóa/giải mã dữ liệu bất kỳ)
chacha20poly1305 = "0.10"

# Xóa sạch khóa nhạy cảm khỏi RAM sau khi tính toán
zeroize = "1"

# RNG — hoạt động trên wasm32-unknown-unknown qua getrandom(js/wasm)
rand = { version = "0.8", features = ["getrandom"] }
getrandom = { version = "0.2", features = ["js"] }
